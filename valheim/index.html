<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Valheim Mod — Sigetar</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Моды и инструменты для Valheim от Sigetar.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css?v=7">
    <style>
        /* Valheim page overrides */
        .valheim-hero {
            text-align: center;
            padding: 80px 0 40px;
        }
        .valheim-hero .section-title {
            font-size: clamp(2rem, 5vw, 3.5rem);
        }
        .valheim-hero .section-lead {
            max-width: 600px;
            margin: 0 auto;
        }
        .valheim-content {
            padding: 40px 0 80px;
        }
        .valheim-content .panel {
            margin-bottom: 24px;
        }
        .panel-text {
            color: rgba(255,255,255,0.6);
            line-height: 1.7;
        }
        .coming-soon {
            text-align: center;
            padding: 60px 20px;
            color: rgba(255,255,255,0.4);
            font-family: var(--font-display);
            font-size: 1.1rem;
            letter-spacing: 0.1em;
        }
    </style>
</head>
<body>
    <header class="site-header">
        <div class="container header-inner">
            <div class="home-box" style="display:flex;align-items:center;gap:12px;">
                <a class="home-link" href="/" data-local="../Start/index.html" title="На главную sigetar.ru" style="color:hsl(var(--primary));text-decoration:none;font-family:var(--font-display);font-weight:700;letter-spacing:0.05em;">← Sigetar.ru</a>
            </div>
            <a class="brand" href="/valheim/" data-local="index.html">
                <span class="brand-name">Valheim Mod</span>
                <span class="brand-tag">[ Mods & Tools ]</span>
            </a>
        </div>
    </header>

    <main class="container">
        <div class="valheim-hero">
            <h1 class="section-title">Valheim Mod</h1>
            <p class="section-lead">
                Моды и инструменты для Valheim — улучшения геймплея,
                новые предметы, настройки сервера и многое другое.
            </p>
        </div>

        <hr class="rule">

        <div class="valheim-content">
            <p class="coming-soon">Раздел в разработке — скоро здесь появится контент</p>
        </div>
    </main>

    <script>
        /* Поддержка локальных ссылок при открытии с диска */
        if (location.protocol === 'file:') {
            document.querySelectorAll('[data-local]').forEach(a => {
                a.href = a.dataset.local;
            });
        }
    </script>
</body>
</html>
