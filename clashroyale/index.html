<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clash Royale — Sigetar.ru</title>
    <meta name="description" content="Раздел Clash Royale на sigetar.ru — скоро.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        /* Временная страница раздела Clash Royale.
           Стиль — как на главной (E:\WebSite\Start\css\style.css). */
        :root {
            --bg:      hsl(220 40% 4%);
            --card:    hsl(220 38% 7%);
            --text:    hsl(190 30% 92%);
            --muted:   hsl(200 15% 65%);
            --border:  hsl(200 50% 22%);
            --amber:   hsl(36 95% 55%);
            --blue:    hsl(220 45% 34%);
            --blue-ink: hsl(220 60% 72%);
            --font-display: "Orbitron", "Rajdhani", sans-serif;
            --font-heading: "Rajdhani", sans-serif;
            --font-body: "Inter", system-ui, sans-serif;
        }

        * { box-sizing: border-box; }

        html, body { margin: 0; padding: 0; }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            font-family: var(--font-body);
            line-height: 1.6;
            color: var(--text);
            background:
                linear-gradient(180deg, hsl(220 50% 3% / .72), hsl(220 45% 5% / .92)),
                url("img/ClashRoyale.jpg") center / cover no-repeat fixed,
                var(--bg);
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            padding: 0 1.5rem;
            min-height: 64px;
            background: hsl(220 40% 4% / .6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid hsl(200 50% 22% / .5);
        }

        .brand {
            font-family: var(--font-display);
            font-weight: 900;
            font-size: 0.95rem;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: var(--text);
            text-decoration: none;
        }

        .home-link {
            padding: 6px 12px;
            font-family: var(--font-heading);
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            text-decoration: none;
            color: var(--muted);
            border: 1px solid var(--border);
            transition: color 0.2s, border-color 0.2s, box-shadow 0.2s;
        }

        .home-link:hover,
        .home-link:focus-visible {
            color: var(--amber);
            border-color: var(--amber);
            box-shadow: 0 0 14px hsl(36 95% 55% / .35);
            outline: none;
        }

        main {
            flex: 1;
            display: grid;
            place-items: center;
            padding: 3rem 1rem;
        }

        .panel {
            position: relative;
            width: 100%;
            max-width: 560px;
            padding: 32px 28px;
            text-align: center;
            background: hsl(220 38% 7% / .78);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            border: 1px solid hsl(200 50% 22% / .7);
        }

        .panel::before,
        .panel::after {
            content: "";
            position: absolute;
            width: 18px;
            height: 18px;
            pointer-events: none;
        }

        .panel::before {
            top: -1px;
            left: -1px;
            border-top: 1px solid var(--blue);
            border-left: 1px solid var(--blue);
        }

        .panel::after {
            right: -1px;
            bottom: -1px;
            border-right: 1px solid var(--blue);
            border-bottom: 1px solid var(--blue);
        }

        .eyebrow {
            margin: 0 0 0.75rem;
            font-family: var(--font-heading);
            font-size: 11px;
            letter-spacing: 0.5em;
            text-transform: uppercase;
            color: var(--blue-ink);
        }

        h1 {
            margin: 0 0 1rem;
            font-family: var(--font-display);
            font-weight: 900;
            font-size: clamp(1.8rem, 6vw, 2.75rem);
            line-height: 1.05;
            text-transform: uppercase;
            color: var(--amber);
            text-shadow: 0 0 18px hsl(36 95% 55% / .45);
        }

        p {
            margin: 0 0 1.75rem;
            color: var(--muted);
        }

        .btn {
            display: inline-block;
            padding: 14px 32px;
            font-family: var(--font-display);
            font-weight: 700;
            font-size: 0.85rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            text-decoration: none;
            color: var(--amber);
            background: hsl(36 95% 55% / .05);
            border: 1px solid hsl(36 95% 55% / .6);
            transition: all 0.3s ease-out;
        }

        .btn:hover,
        .btn:focus-visible {
            color: hsl(220 50% 6%);
            background: linear-gradient(135deg, hsl(36 95% 55%), hsl(28 95% 50%));
            outline: none;
        }

        footer {
            padding: 1.5rem;
            font-family: var(--font-heading);
            font-size: 12px;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            text-align: center;
            color: var(--muted);
            border-top: 1px solid hsl(200 50% 22% / .6);
            background: hsl(220 50% 3% / .8);
        }
    </style>
</head>
<body>
    <header>
        <a class="brand" href="/" data-local="../Start/index.html">Sigetar</a>
        <a class="home-link" href="/" data-local="../Start/index.html">← Sigetar.ru</a>
    </header>

    <main>
        <div class="panel">
            <p class="eyebrow">// Clash Royale</p>
            <h1>Скоро</h1>
            <p>Раздел о Clash Royale в разработке. Пока профиль игрока и колода — на главной странице.</p>
            <a class="btn" href="/#about" data-local="../Start/index.html">На главную</a>
        </div>
    </main>

    <footer>© 2026 Sigetar · [ Sigetar ]</footer>

    <script>
        /* С диска (file://) ссылки вида / не работают — подставляем data-local */
        if (location.protocol === "file:") {
            document.querySelectorAll("a[data-local]").forEach(function (a) {
                a.href = a.getAttribute("data-local");
            });
        }
    </script>
</body>
</html>
