<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clash Royale — Sigetar.ru</title>
    <meta name="description" content="Раздел Clash Royale на sigetar.ru — скоро.">
    <link rel="stylesheet" href="/style/site.css?v=2">
    <style>
        /* Clash Royale — временная страница «Скоро».
           Общий стиль: /style/site.css (E:\WebSite\Style). Здесь — только своё. */

        /* Картинка раздела на весь экран — неподвижным слоем (без мигания при прокрутке) */
        .cr-bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            background:
                linear-gradient(180deg, hsl(var(--space-deep) / .72), hsl(var(--background) / .92)),
                url("img/ClashRoyale.jpg") center / cover no-repeat;
            will-change: transform;
            transform: translateZ(0);
        }

        main.cr-soon {
            display: grid;
            place-items: center;
        }

        .cr-soon .panel {
            width: 100%;
            max-width: 560px;
            padding: 32px 28px;
            text-align: center;
            background: hsl(var(--card) / .9);
        }

        .cr-soon .panel:hover {
            transform: none;
        }

        .cr-soon h1 {
            margin: 0 0 1rem;
            font-family: var(--font-display);
            font-weight: 900;
            font-size: clamp(1.8rem, 6vw, 2.75rem);
            line-height: 1.05;
            text-transform: uppercase;
            color: hsl(var(--primary));
            text-shadow: 0 0 18px hsl(var(--primary) / .45);
        }

        .cr-soon .panel p {
            margin: 0 0 1.75rem;
        }
    </style>
</head>
<body>
    <script src="/style/layout.js?v=1"></script>
    <div class="cr-bg" aria-hidden="true"></div>

    <main class="cr-soon">
        <div class="panel">
            <p class="eyebrow">// Clash Royale</p>
            <h1>Скоро</h1>
            <p>Раздел о Clash Royale в разработке. Пока профиль игрока и колода — на главной странице.</p>
            <a class="btn" href="/#clashroyale">На главную</a>
        </div>
    </main>
</body>
</html>
